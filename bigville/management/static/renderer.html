<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/management/game/">
  <title>Bigville referee renderer</title>
  <link rel="stylesheet" href="game.css">
  <style>
    html,body{margin:0;min-height:100%;background:#172126;color:#e7ede8}
    .layout{display:block;min-height:0;background:#172126}
    .game-panel{min-height:480px;width:100%;padding:0}
    #game{width:100%;height:480px}
    .view-controls{top:8px;right:8px}
    .hint,.sidebar{display:none!important}
  </style>
</head>
<body>
  <main class="layout">
    <section class="game-panel" aria-label="Read-only referee map"><div id="game"></div>
      <div class="view-controls"><span>View</span><button id="zoom-out" type="button" title="Zoom out">−</button><button id="zoom-reset" type="button" title="Reset view">125%</button><button id="zoom-in" type="button" title="Zoom in">+</button></div>
    </section>
    <aside class="sidebar" aria-hidden="true">
      <div id="status"></div><div id="resident"></div><select id="inspect-resident"></select><div id="inventory"></div>
      <div id="actions"></div><select id="recipient"></select><input id="speech"><button id="speak"></button><div id="log"></div><button id="reset"></button>
    </aside>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="/management/readonly-renderer.js"></script>
  <script src="game.js"></script>
</body>
</html>
