[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigville"
version = "0.1.0"
description = "A data-driven, turn-based village simulation with pluggable cognition backends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["bigville*", "domains*", "worlds*"]

[tool.setuptools.package-data]
bigville = ["seeds/*.json", "game/*.html", "game/*.js", "game/*.css", "game/assets/*"]
